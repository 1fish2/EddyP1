[project]
name = "eddyp1"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "altair>=6.3.0",
    "marimo==0.25.2",
    "numpy>=2.5.5",
    "polars>=2.0.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
