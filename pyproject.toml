[project]
name = "eddyp1"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "altair>=6.3.0",
    "marimo>=0.25.2",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "scipy>=1.18.1",
    "scipy-stubs~=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.extend-per-file-ignores]
"notebooks/*.py" = ["B018", "PLR1711"]

# Altair 6's @use_signature decorator currently leaves an unresolved generic R@__call__ in ty.
[[tool.ty.overrides]]
include = ["src/perimeter_flux/charts.py"]

[tool.ty.overrides.rules]
missing-attribute = "ignore"
